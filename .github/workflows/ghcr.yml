name: Build and Push Docker Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '0.0.0.dev0'
      push:
        description: 'Push to registry'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: tamipami
          channels: conda-forge,bioconda

      - name: Install dependencies
        run: |
          conda install -y -c conda-forge -c bioconda --file conda-requirements.txt
          pip install --no-cache-dir -r pip-requirements.txt
          pip install --no-cache-dir .

      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH: ${{ github.event.inputs.push }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            PUSH="$INPUT_PUSH"
            if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
              echo "Invalid version: $VERSION" >&2
              exit 1
            fi
            git tag -f "v$VERSION" HEAD
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            PUSH="true"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PUSH=$PUSH" >> $GITHUB_ENV
          echo "PLATFORM_PAIR=${MATRIX_PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (native runner, push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.VERSION }}
          outputs: type=image,name=ghcr.io/usda-ars-gbru/tamipami,push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH: ${{ github.event.inputs.push }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            PUSH="$INPUT_PUSH"
            if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
              echo "Invalid version: $VERSION" >&2
              exit 1
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            PUSH="true"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PUSH=$PUSH" >> $GITHUB_ENV

      - name: Download digests
        if: env.PUSH == 'true'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: env.PUSH == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        if: env.PUSH == 'true'
        working-directory: /tmp/digests
        run: |
          TAGS=(-t "ghcr.io/usda-ars-gbru/tamipami:${VERSION}")
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            TAGS+=(-t "ghcr.io/usda-ars-gbru/tamipami:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf 'ghcr.io/usda-ars-gbru/tamipami@sha256:%s ' *)
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Test image
        if: github.event_name == 'workflow_dispatch' && env.PUSH == 'true'
        run: |
          docker run --rm --entrypoint python ghcr.io/usda-ars-gbru/tamipami:${{ env.VERSION }} -c "import tamipami; print(tamipami.__version__)"
