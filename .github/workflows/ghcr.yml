name: Build and Push Docker Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '0.0.0.dev0'
      push:
        description: 'Push to registry'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: tamipami
          channels: conda-forge,bioconda

      - name: Install dependencies
        run: |
          conda install -y -c conda-forge -c bioconda --file conda-requirements.txt
          pip install --no-cache-dir -r pip-requirements.txt
          pip install --no-cache-dir .

      - name: Run tests
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH: ${{ github.event.inputs.push }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            PUSH="$INPUT_PUSH"
            if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
              echo "Invalid version: $VERSION" >&2
              exit 1
            fi
            git tag -f "v$VERSION" HEAD
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            PUSH="true"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PUSH=$PUSH" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/usda-ars-gbru/tamipami:${{ env.VERSION }}
            ${{ github.event_name != 'workflow_dispatch' && 'ghcr.io/usda-ars-gbru/tamipami:latest' || '' }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        if: github.event_name == 'workflow_dispatch' && env.PUSH == 'true'
        run: |
          docker run --rm --entrypoint python ghcr.io/usda-ars-gbru/tamipami:${{ env.VERSION }} -c "import tamipami; print(tamipami.__version__)"