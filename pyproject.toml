[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tamipami"
dynamic = ["version"]

description = "Software to identify the PAM or TAM sites from high-throughput cleavage screening experiments"
authors = [
    {name = "Adam R. Rivers", email =  "adam.rivers@usda.gov"},]
maintainers = [
    {name = "Adam R. Rivers", email =  "adam.rivers@usda.gov"},]
license = {file = "LICENSE.txt"}
readme = "readme.md"
keywords = ["CRISPR","Cas"]
requires-python = ">=3.10"

# Lower bounds are the oldest releases with the APIs TamiPami uses; CI tests the versions
# pinned in conda-requirements.txt and pip-requirements.txt.
dependencies = [
    "biopython>=1.80",
    "ortools>=9.15,<10",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "ckmeans>=0.2.10",
    "matplotlib>=3.8",
    "scikit-bio>=0.6",
    "logomaker>=0.8.7",
    "altair>=5.0",
    "pyyaml>=6.0",
    "streamlit>=1.50,<2",
    "tables>=3.8",
    "scikit-learn>=1.3"
    ]

[external]
  dependencies = [
    "pkg:sourceforge:BBMap@39.52"
  ]

[project.urls]
repository = "http://github.com/usda-ars-gbru/tamipami"


[tool.setuptools_scm]
write_to = "tamipami/_version.py"
tag_regex = '^v(?P<version>.*)$'

[tool.setuptools]
packages = ['tamipami']

[project.scripts]
tamipami = "tamipami.cli:main"