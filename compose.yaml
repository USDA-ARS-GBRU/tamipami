name: tamipami-server
services:
    tamipami:
        container_name: streamlit
        image: ghcr.io/usda-ars-gbru/tamipami:latest
        ports:
            - "127.0.0.1:8501:8501"
        env_file:
            - .env
        environment:
            # CORS and XSRF protection are disabled to allow Nginx proxying
            - STREAMLIT_SERVER_ENABLE_CORS=false
            - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
            - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID}
        # Hardening: the app only needs to write uploads and logs to /tmp
        read_only: true
        tmpfs:
            - /tmp:size=2g
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        mem_limit: 4g
        restart: always  # Correct location
    watchtower:
        container_name: watchtower
        image: containrrr/watchtower
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=3600
        restart: always  # Correct location
