name: tamipami-server
services:
    tamipami:
        container_name: streamlit
        image: ghcr.io/usda-ars-gbru/tamipami:latest
        ports:
            - "127.0.0.1:8501:8501"
        env_file:
            - .env
        environment:
            # CORS and XSRF protection are disabled to allow Nginx proxying
            - STREAMLIT_SERVER_ENABLE_CORS=false
            - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
        # Hardening: the app only needs to write uploads and logs to /tmp
        read_only: true
        tmpfs:
            - /tmp:size=2g
        cap_drop:
            - ALL
        # no-new-privileges is omitted: on the production host it makes exec of
        # /opt/conda/bin/streamlit fail with "operation not permitted". The container
        # already runs as a non-root user with all capabilities dropped.
        mem_limit: 4g
        restart: always  # Correct location
    watchtower:
        container_name: watchtower
        image: containrrr/watchtower
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=3600
            # containrrr/watchtower defaults to Docker API 1.25, which current Docker Engine
            # (minimum 1.40) rejects. Pin a supported version.
            - DOCKER_API_VERSION=1.44
        restart: always  # Correct location
